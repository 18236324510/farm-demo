<!DOCTYPE html>
<!--
设计说明 / DESIGN NOTES (for porting to Godot/Unity/etc.)
- State (pure data, JSON-serializable, saved to localStorage key "farmDemoSave"):
  state = {day, time(minutes from 6:00), gold, energy, player{x,y,dir}, tool, inv{itemId:count}, bin{itemId:count},
           tiles[y][x] = {t:'grass'|'soil'|'water'|'house'|'bin'|'path', watered, crop:{id, stage}|null}}
- Data tables: CROPS (seed price, sell price, stages, color), TOOLS (toolbar order).
- Systems (functions, engine-agnostic logic): move(), interact(tx,ty) dispatches by tool,
  endDay() (ship bin -> gold, grow watered crops +1 stage, reset water, restore energy), save()/load().
- Rendering: drawTile/drawCrop/drawPlayer/drawHUD are procedural canvas draws; replace with sprites in port.
- Loop: requestAnimationFrame -> update(dt) (input, clock) -> render(). Clock: 1 real sec = 10 game min; at 2:00 forced sleep.
-->
<html lang="zh"><head><meta charset="utf-8"><title>小小农场 Demo</title>
<style>body{margin:0;background:#222;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center}canvas{image-rendering:pixelated;border:2px solid #000;margin-top:8px}#help{font-size:13px;margin:6px;opacity:.8}</style></head>
<body><canvas id="c" width="640" height="512"></canvas>
<div id="help">WASD/方向键移动 · 1-6选工具 · 空格/点击 使用 · 在出货箱旁按空格(手)放入作物 · 进屋门口或按N睡觉 · R重置存档</div>
<script>
const T=32,W=20,H=14,cv=document.getElementById('c'),g=cv.getContext('2d');
const CROPS={parsnip:{name:'防风草',seed:20,sell:35,stages:4,color:'#f2e6b0'},
 potato:{name:'土豆',seed:50,sell:80,stages:5,color:'#c49a5a'},
 berry:{name:'草莓',seed:100,sell:180,stages:6,color:'#e33'}};
const TOOLS=[{id:'hand',name:'手'},{id:'hoe',name:'锄头'},{id:'can',name:'水壶'},
 {id:'seed',crop:'parsnip',name:'防风草种子'},{id:'seed',crop:'potato',name:'土豆种子'},{id:'seed',crop:'berry',name:'草莓种子'}];
let state,msg='',msgT=0;
function newState(){const tiles=[];for(let y=0;y<H;y++){tiles.push([]);for(let x=0;x<W;x++){let t='grass';
 if(x>=15&&y>=9&&x<19&&y<13)t='water';if(x>=1&&x<5&&y>=1&&y<4)t='house';if(x==6&&y==3)t='bin';
 tiles[y].push({t,watered:false,crop:null});}}
 return{day:1,time:0,gold:200,energy:100,player:{x:3,y:5,dir:'down'},tool:0,inv:{},bin:{},tiles};}
function save(){localStorage.setItem('farmDemoSave',JSON.stringify(state));}
function load(){try{const s=JSON.parse(localStorage.getItem('farmDemoSave'));if(s&&s.tiles)return s;}catch(e){}return null;}
state=load()||newState();
function say(m){msg=m;msgT=3;}
const D={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function walkable(x,y){if(x<0||y<0||x>=W||y>=H)return false;const t=state.tiles[y][x].t;return t!='water'&&t!='house'&&t!='bin';}
function move(dir){const p=state.player;p.dir=dir;const[dx,dy]=D[dir];if(walkable(p.x+dx,p.y+dy)){p.x+=dx;p.y+=dy;}}
function facing(){const p=state.player,[dx,dy]=D[p.dir];return[p.x+dx,p.y+dy];}
function useEnergy(n){if(state.energy<n){say('太累了，去睡觉吧！');return false;}state.energy-=n;return true;}
function interact(tx,ty){
 if(tx<0||ty<0||tx>=W||ty>=H)return;const tile=state.tiles[ty][tx],tool=TOOLS[state.tool];
 if(tile.t=='house'){sleep();return;}
 if(tile.t=='bin'){let n=0;for(const k in state.inv){state.bin[k]=(state.bin[k]||0)+state.inv[k];n+=state.inv[k];}state.inv={};
  say(n?`放入出货箱 ${n} 件，明早结算`:'没有可出售的作物');save();return;}
 if(tool.id=='hand'){if(tile.crop&&tile.crop.stage>=CROPS[tile.crop.id].stages-1){const id=tile.crop.id;
   state.inv[id]=(state.inv[id]||0)+1;tile.crop=null;say('收获了 '+CROPS[id].name+'！');save();}
  else if(tile.crop)say('还没成熟');return;}
 if(tool.id=='hoe'){if(tile.t=='grass'){if(!useEnergy(2))return;tile.t='soil';say('锄好了地');}return;}
 if(tool.id=='can'){if(tile.t=='water'){say('水壶已灌满');return;}
  if(tile.t=='soil'&&!tile.watered){if(!useEnergy(1))return;tile.watered=true;}return;}
 if(tool.id=='seed'){const c=CROPS[tool.crop];if(tile.t!='soil'||tile.crop){say('需要空的耕地');return;}
  if(state.gold<c.seed){say('金币不足');return;}state.gold-=c.seed;tile.crop={id:tool.crop,stage:0};say(`种下${c.name}（-${c.seed}金）`);save();}
}
function sleep(){let earned=0;for(const k in state.bin)earned+=CROPS[k].sell*state.bin[k];state.bin={};state.gold+=earned;
 for(const row of state.tiles)for(const t of row){if(t.crop&&t.watered){const max=CROPS[t.crop.id].stages-1;if(t.crop.stage<max)t.crop.stage++;}
  t.watered=false;if(t.t=='soil'&&!t.crop&&Math.random()<0.05)t.t='grass';}
 state.day++;state.time=0;state.energy=100;state.player={x:3,y:5,dir:'down'};
 say(`第${state.day}天开始了。`+(earned?`出货收入 +${earned}金`:''));save();}
const keys={};let moveCD=0,clockAcc=0;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;
 if(k>='1'&&k<='6')state.tool=+k-1;if(k==' '){e.preventDefault();interact(...facing());}
 if(k=='n')sleep();if(k=='r'&&confirm('重置存档？')){state=newState();save();}
 if(k.startsWith('arrow'))e.preventDefault();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(y>H*T){const i=Math.floor((x-10)/60);if(i>=0&&i<TOOLS.length)state.tool=i;return;}
 const tx=Math.floor(x/T),ty=Math.floor(y/T),p=state.player;
 if(Math.abs(tx-p.x)+Math.abs(ty-p.y)==1){p.dir=tx>p.x?'right':tx<p.x?'left':ty>p.y?'down':'up';interact(tx,ty);}
 else if(tx==p.x&&ty==p.y)interact(...facing());else say('点击角色相邻的格子');});
function update(dt){moveCD-=dt;msgT-=dt;
 if(moveCD<=0){const m=keys.w||keys.arrowup?'up':keys.s||keys.arrowdown?'down':keys.a||keys.arrowleft?'left':keys.d||keys.arrowright?'right':null;
  if(m){move(m);moveCD=0.13;}}
 clockAcc+=dt;if(clockAcc>=1){clockAcc-=1;state.time+=10;if(state.time>=20*60){say('太晚了，你昏睡过去…');sleep();}}}
function drawTile(x,y,t){const px=x*T,py=y*T;
 g.fillStyle=((x+y)%2)?'#5fa04a':'#64a84e';g.fillRect(px,py,T,T);
 if(t.t=='grass'&&(x*7+y*13)%5==0){g.fillStyle='#4c8a3a';g.fillRect(px+8,py+12,2,6);g.fillRect(px+20,py+20,2,5);}
 if(t.t=='soil'){g.fillStyle=t.watered?'#5a3b22':'#9a6b40';g.fillRect(px+1,py+1,T-2,T-2);g.fillStyle='rgba(0,0,0,.15)';for(let i=6;i<T;i+=9)g.fillRect(px+3,py+i,T-6,2);}
 if(t.t=='water'){g.fillStyle='#3b7fd0';g.fillRect(px,py,T,T);g.fillStyle='#7fb6ee';g.fillRect(px+5+(Date.now()/300+x)%10,py+10,8,2);}
 if(t.t=='bin'){g.fillStyle='#8a5a2b';g.fillRect(px+3,py+8,T-6,T-10);g.fillStyle='#b07a40';g.fillRect(px+1,py+5,T-2,6);}
 if(t.crop)drawCrop(px,py,t.crop);}
function drawCrop(px,py,c){const d=CROPS[c.id],max=d.stages-1,f=c.stage/max;
 g.fillStyle='#2e8b2e';const h=4+f*18;g.fillRect(px+15,py+26-h,3,h);
 if(c.stage>0){g.fillRect(px+9,py+24-h*0.6,6,3);g.fillRect(px+18,py+22-h*0.7,6,3);}
 if(c.stage>=max){g.fillStyle=d.color;g.beginPath();g.arc(px+16,py+8,6,0,7);g.fill();}}
function drawHouse(){const px=T,py=T;g.fillStyle='#c9a26b';g.fillRect(px,py+28,4*T,3*T-28);
 g.fillStyle='#a33';g.beginPath();g.moveTo(px-6,py+30);g.lineTo(px+2*T,py-6);g.lineTo(px+4*T+6,py+30);g.fill();
 g.fillStyle='#5a3a1a';g.fillRect(px+T*1.6,py+T*2,T*0.8,T);g.fillStyle='#aee';g.fillRect(px+12,py+44,18,14);g.fillRect(px+T*3-6,py+44,18,14);}
function drawPlayer(){const p=state.player,px=p.x*T,py=p.y*T;g.fillStyle='rgba(0,0,0,.25)';g.fillRect(px+8,py+27,16,4);
 g.fillStyle='#2a5bd7';g.fillRect(px+10,py+14,12,12);g.fillStyle='#f1c9a0';g.fillRect(px+10,py+4,12,10);
 g.fillStyle='#6b3e1e';g.fillRect(px+9,py+2,14,4);g.fillStyle='#000';
 const [dx,dy]=D[p.dir];if(p.dir!='up'){g.fillRect(px+13+dx*2,py+8,2,2);g.fillRect(px+18+dx*2,py+8,2,2);}
 const [fx,fy]=facing();g.strokeStyle='rgba(255,255,255,.6)';g.strokeRect(fx*T+1,fy*T+1,T-2,T-2);}
function render(){for(let y=0;y<H;y++)for(let x=0;x<W;x++)drawTile(x,y,state.tiles[y][x]);drawHouse();drawPlayer();
 g.fillStyle='#000';g.fillRect(0,H*T,cv.width,64);g.font='12px sans-serif';
 TOOLS.forEach((t,i)=>{const x=10+i*60;g.fillStyle=i==state.tool?'#ffd34d':'#555';g.fillRect(x,H*T+6,56,26);
  g.fillStyle=i==state.tool?'#000':'#fff';g.fillText((i+1)+' '+t.name.replace('种子','籽'),x+3,H*T+23);});
 const inv=Object.keys(state.inv).map(k=>CROPS[k].name+'×'+state.inv[k]).join(' ')||'空';
 const bin=Object.values(state.bin).reduce((a,b)=>a+b,0);
 g.fillStyle='#fff';g.fillText('背包: '+inv+'   出货箱: '+bin+'件',10,H*T+52);
 const hr=6+Math.floor(state.time/60),mn=state.time%60;
 g.fillStyle='rgba(0,0,0,.6)';g.fillRect(cv.width-170,4,166,62);g.fillStyle='#fff';g.font='14px sans-serif';
 g.fillText(`第 ${state.day} 天  ${String(hr%24).padStart(2,'0')}:${String(mn).padStart(2,'0')}`,cv.width-162,22);
 g.fillText(`金币: ${state.gold}`,cv.width-162,40);g.fillText('体力',cv.width-162,58);
 g.fillStyle='#333';g.fillRect(cv.width-125,48,112,10);g.fillStyle=state.energy>30?'#4c4':'#d44';g.fillRect(cv.width-125,48,112*state.energy/100,10);
 const dark=Math.max(0,(state.time-12*60)/(8*60))*0.45;if(dark>0){g.fillStyle=`rgba(10,10,60,${dark})`;g.fillRect(0,0,cv.width,H*T);}
 if(msgT>0){g.font='15px sans-serif';const w=g.measureText(msg).width+20;g.fillStyle='rgba(0,0,0,.7)';g.fillRect(10,10,w,26);g.fillStyle='#fff';g.fillText(msg,20,28);}}
let last=performance.now();function loop(n){const dt=Math.min(.1,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(loop);}
setInterval(save,10000);window.__game={get state(){return state},interact,sleep,move};requestAnimationFrame(loop);
</script></body></html>
